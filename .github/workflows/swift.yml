name: Native Swift validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'SemVer for optional owner-dispatched release (without v prefix)'
        type: string
        required: true
      release_confirmation:
        description: 'Manual dispatch only: enter APPROVE-vX.Y.Z'
        type: string
        required: true

# Superseded PR runs may not delay the exact-head release gate.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  native:
    name: Swift build and tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, xcode-27]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Check all signing and packaging scripts for Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/*.sh; do
            bash -n "$script"
          done
      - name: Verify version and release metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' App/Info.plist)"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' App/Info.plist)"
          [[ "$build" =~ ^[1-9][0-9]*$ ]]
          test -s "docs/releases/v$version.md"
          asset="lueya-$version-macos-arm64.zip"
          for readme in README.md README.ru.md; do
            grep -Fq "/releases/download/v$version/$asset" "$readme"
          done
      - name: Build optimized app
        run: swift build --configuration release --product LueyaApp -Xswiftc -Osize -Xlinker -dead_strip
      - name: Test
        run: swift test --parallel
      - name: Package app
        run: ./scripts/package-app.sh
      - name: Verify architecture, metadata, signature and sandbox
        shell: bash
        run: |
          set -euo pipefail
          app="dist/lueya.app"
          bin="$app/Contents/MacOS/LueyaApp"
          test -x "$bin"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")" = "26.0"
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' App/Info.plist)"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$version"
          test "$(/usr/bin/lipo -archs "$bin")" = "arm64"
          /usr/bin/codesign --verify --strict "$app"
          entitlements="$(mktemp)"
          /usr/bin/codesign --display --entitlements - --xml "$app" > "$entitlements" 2>/dev/null
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.app-sandbox' "$entitlements")" = true
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.network.client' "$entitlements")" = true
          rm -f "$entitlements"
          echo "Executable size (bytes): $(stat -f %z "$bin")"
      - name: Create, unpack and verify versioned ZIP
        if: matrix.os == 'xcode-27'
        shell: bash
        run: |
          set -euo pipefail
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' App/Info.plist)"
          archive="dist/lueya-$version-macos-arm64.zip"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "dist/lueya.app" "$archive"
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          /usr/bin/ditto -x -k "$archive" "$scratch"
          test -x "$scratch/lueya.app/Contents/MacOS/LueyaApp"
          /usr/bin/codesign --verify --strict "$scratch/lueya.app"
          test "$(/usr/bin/lipo -archs "$scratch/lueya.app/Contents/MacOS/LueyaApp")" = "arm64"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$scratch/lueya.app/Contents/Info.plist")" = "$version"
          shasum -a 256 "$archive"
          echo "ZIP size (bytes): $(stat -f %z "$archive")"
      - name: Upload release payload for cross-runner publish job
        if: matrix.os == 'xcode-27'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lueya-versioned-package
          archive: false
          path: dist/lueya-*-macos-arm64.zip
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Owner-approved, certificate-signed GitHub Release
    # Owner feedback on v0.5.2 authorizes one signed v0.5.3 trial; no extra approval.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        startsWith(github.event.head_commit.message,
                   'test(lueya): owner-feedback v0.5.3 signed trial [one-shot]')))
    needs: native
    runs-on: xcode-27
    timeout-minutes: 30
    environment: lueya-signing
    permissions:
      contents: write
    steps:
      - name: Require repository-owner confirmation for this exact version
        shell: bash
        env:
          RELEASE_ACTOR: ${{ github.actor }}
          REQUESTED_VERSION: ${{ inputs.release_version }}
          RELEASE_CONFIRMATION: ${{ inputs.release_confirmation }}
          APPROVED_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || exit 1
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            # Feedback on v0.5.2 authorizes one guarded version-specific release.
            # No unrelated push may publish, and the next cycle awaits feedback.
            [[ "$APPROVED_COMMIT_MESSAGE" == "test(lueya): owner-feedback v0.5.3 signed trial [one-shot]"* ]] || exit 1
            [[ -z "$REQUESTED_VERSION" && -z "$RELEASE_CONFIRMATION" ]] || exit 1
          else
            [[ "$RELEASE_ACTOR" == "StanleyLl0yd" ]] || {
              echo "::error::Only the repository owner can dispatch a release"
              exit 1
            }
            [[ "$REQUESTED_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
            [[ "$RELEASE_CONFIRMATION" == "APPROVE-v$REQUESTED_VERSION" ]] || {
              echo "::error::Missing matching explicit owner confirmation"
              exit 1
            }
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate version metadata and reject previously published versions
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.release_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' App/Info.plist)"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            test "$version" = "0.5.3"
          else
            test "$version" = "$REQUESTED_VERSION"
          fi
          test -s "docs/releases/v$version.md"
          if gh release view "v$version" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Immutable release v$version already exists"
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" >/dev/null 2>&1; then
            echo "::error::Tag v$version already exists"
            exit 1
          fi
      - name: Import pinned signing identity from protected Environment
        shell: bash
        env:
          MACOS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.MACOS_SIGNING_CERTIFICATE_BASE64 }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_CERTIFICATE_SHA256: ${{ vars.MACOS_SIGNING_CERTIFICATE_SHA256 }}
        run: bash scripts/import-signing-identity.sh
      - name: Build and sign distributable macOS app
        run: |
          set -euo pipefail
          ./scripts/package-app.sh
          bash scripts/verify-signing-identity.sh
      - name: Verify released archive contains signed arm64 app
        shell: bash
        run: |
          set -euo pipefail
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' App/Info.plist)"
          asset="lueya-$version-macos-arm64.zip"
          mkdir -p release
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            "dist/lueya.app" "release/$asset"
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          /usr/bin/ditto -x -k "release/$asset" "$scratch"
          /usr/bin/codesign --verify --strict "$scratch/lueya.app"
          test "$(/usr/bin/lipo -archs "$scratch/lueya.app/Contents/MacOS/LueyaApp")" = "arm64"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$scratch/lueya.app/Contents/Info.plist")" = "$version"
          /usr/bin/codesign -dr - "$scratch/lueya.app" 2>&1 |
            grep -F 'com.stanleylloyd.lueya'
          (cd release && shasum -a 256 "$asset" > SHA256SUMS.txt)
      - name: Publish immutable signed ZIP after all validations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' App/Info.plist)"
          gh release create "v$version" \
            "release/lueya-$version-macos-arm64.zip" release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --latest \
            --title "lueya v$version" \
            --notes-file "docs/releases/v$version.md"
      - name: Remove temporary signing keychain and decoded identity
        if: always()
        shell: bash
        run: |
          if [[ -n "${LUEYA_CODESIGN_KEYCHAIN:-}" ]]; then
            security delete-keychain "${LUEYA_CODESIGN_KEYCHAIN:-}" || true
          fi
          if [[ -n "${LUEYA_CODESIGN_P12:-}" ]]; then rm -f "${LUEYA_CODESIGN_P12:-}"; fi
          if [[ -n "${LUEYA_CODESIGN_CERT:-}" ]]; then
            /usr/bin/perl -e 'alarm 15; exec @ARGV' \
              /usr/bin/sudo -n /usr/bin/security remove-trusted-cert -d \
              "${LUEYA_CODESIGN_CERT:-}" || true
            rm -f "${LUEYA_CODESIGN_CERT:-}"
          fi
