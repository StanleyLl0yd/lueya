name: Native Swift validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Swift build and tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, xcode-27]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Verify version and release metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' App/Info.plist)"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' App/Info.plist)"
          [[ "$build" =~ ^[1-9][0-9]*$ ]]
          test -s "docs/releases/v$version.md"
          asset="lueya-$version-macos-arm64.zip"
          for readme in README.md README.ru.md; do
            grep -Fq "/releases/download/v$version/$asset" "$readme"
          done
      - name: Build optimized app
        run: swift build --configuration release --product LueyaApp -Xswiftc -Osize -Xlinker -dead_strip
      - name: Test
        run: swift test --parallel
      - name: Package app
        run: ./scripts/package-app.sh
      - name: Verify architecture, metadata, signature and sandbox
        shell: bash
        run: |
          set -euo pipefail
          app="dist/lueya.app"
          bin="$app/Contents/MacOS/LueyaApp"
          test -x "$bin"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")" = "26.0"
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' App/Info.plist)"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$version"
          test "$(/usr/bin/lipo -archs "$bin")" = "arm64"
          /usr/bin/codesign --verify --strict "$app"
          entitlements="$(mktemp)"
          /usr/bin/codesign --display --entitlements - --xml "$app" > "$entitlements" 2>/dev/null
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.app-sandbox' "$entitlements")" = true
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.network.client' "$entitlements")" = true
          rm -f "$entitlements"
          echo "Executable size (bytes): $(stat -f %z "$bin")"
      - name: Create, unpack and verify versioned ZIP
        if: matrix.os == 'xcode-27'
        shell: bash
        run: |
          set -euo pipefail
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' App/Info.plist)"
          archive="dist/lueya-$version-macos-arm64.zip"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "dist/lueya.app" "$archive"
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          /usr/bin/ditto -x -k "$archive" "$scratch"
          test -x "$scratch/lueya.app/Contents/MacOS/LueyaApp"
          /usr/bin/codesign --verify --strict "$scratch/lueya.app"
          test "$(/usr/bin/lipo -archs "$scratch/lueya.app/Contents/MacOS/LueyaApp")" = "arm64"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$scratch/lueya.app/Contents/Info.plist")" = "$version"
          shasum -a 256 "$archive"
          echo "ZIP size (bytes): $(stat -f %z "$archive")"
      - name: Upload release payload for cross-runner publish job
        if: matrix.os == 'xcode-27'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lueya-versioned-package
          archive: false
          path: dist/lueya-*-macos-arm64.zip
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish immutable SemVer GitHub Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download verified versioned ZIP
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lueya-versioned-package
          path: release
          skip-decompress: true
      - name: Verify ZIP and record SHA256
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import plistlib; print(plistlib.load(open("App/Info.plist","rb"))["CFBundleShortVersionString"])')"
          asset="lueya-$version-macos-arm64.zip"
          test -s "release/$asset"
          unzip -tq "release/$asset" >/dev/null
          (cd release && sha256sum "$asset" > SHA256SUMS.txt)
      - name: Publish a new immutable regular release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(python3 -c 'import plistlib; print(plistlib.load(open("App/Info.plist","rb"))["CFBundleShortVersionString"])')"
          tag="v$version"
          notes="docs/releases/$tag.md"
          asset="lueya-$version-macos-arm64.zip"
          test -s "$notes"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release $tag already exists; refusing to overwrite versioned assets"
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag exists without release; refusing to mutate it"
            exit 1
          fi
          gh release create "$tag" \
            "release/$asset" release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --latest \
            --title "lueya $tag" \
            --notes-file "$notes"
