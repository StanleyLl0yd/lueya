name: Native Swift validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Swift build and tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, xcode-27]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build --configuration release
      - name: Test
        run: swift test --parallel
      - name: Package native M0 source check app
        run: ./scripts/package-app.sh
      - name: Verify bundle, architecture and signed entitlements
        shell: bash
        run: |
          set -euo pipefail
          app="dist/lueya.app"
          test -x "$app/Contents/MacOS/LueyaApp"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")" = "26.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "0.0.4"
          /usr/bin/lipo -archs "$app/Contents/MacOS/LueyaApp" | grep -qw arm64
          /usr/bin/codesign --verify --strict "$app"
          entitlements="$(mktemp)"
          /usr/bin/codesign --display --entitlements - --xml "$app" > "$entitlements" 2>/dev/null
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.app-sandbox' "$entitlements")" = true
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.network.client' "$entitlements")" = true
          rm -f "$entitlements"
      - name: Create and verify downloadable macOS source check build
        if: matrix.os == 'xcode-27'
        shell: bash
        run: |
          set -euo pipefail
          archive="dist/lueya-macos-arm64-m0-stream-check.zip"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "dist/lueya.app" "$archive"
          scratch="$(mktemp -d)"
          /usr/bin/ditto -x -k "$archive" "$scratch"
          test -x "$scratch/lueya.app/Contents/MacOS/LueyaApp"
          /usr/bin/codesign --verify --strict "$scratch/lueya.app"
          /usr/bin/lipo -archs "$scratch/lueya.app/Contents/MacOS/LueyaApp" | grep -qw arm64
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$scratch/lueya.app/Contents/Info.plist")" = "26.0"
          shasum -a 256 "$archive"
          rm -rf "$scratch"
      - name: Upload app ZIP to GitHub Actions
        if: matrix.os == 'xcode-27'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: false
          path: dist/lueya-macos-arm64-m0-stream-check.zip
          if-no-files-found: error
          retention-days: 30

  publish-preview:
    name: Publish M0 stream check research prerelease
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download verified Xcode 27 app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lueya-macos-arm64-m0-stream-check.zip
          path: preview
          skip-decompress: true
      - name: Verify ZIP and create SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          test -s preview/lueya-macos-arm64-m0-stream-check.zip
          unzip -tq preview/lueya-macos-arm64-m0-stream-check.zip >/dev/null
          (cd preview && sha256sum lueya-macos-arm64-m0-stream-check.zip > SHA256SUMS.txt)
      - name: Publish immutable stream-check research prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='v0.0.4-m0-stream-check.1'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release $tag already exists; not overwriting prior build"
            exit 0
          fi
          gh release create "$tag" \
            preview/lueya-macos-arm64-m0-stream-check.zip preview/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease --latest=false \
            --title 'lueya 0.0.4 — M0 raw stream source check' \
            --notes-file docs/STREAM-CHECK-RELEASE-NOTES.md
